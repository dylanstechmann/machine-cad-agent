name: CAD build and agent tools
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cad-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build pinned CAD runtime
        run: |
          python scripts/prepare-ci-runtime.py
          docker compose -f compose.yaml -f compose.ci.yaml build dev
      - name: Geometry, STEP roundtrip and real MCP protocol tests
        run: docker compose run --rm -T dev python -m unittest discover -s tests -v
      - name: Build pass, overfill failure and repaired revisions
        run: docker compose run --rm -T dev python -m machine_cad demo
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cad-reports-and-exports
          path: builds/
          if-no-files-found: warn
          retention-days: 7

  pages:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build pinned CAD runtime
        run: |
          python scripts/prepare-ci-runtime.py
          docker compose -f compose.yaml -f compose.ci.yaml build dev
      - name: Generate the current CAD scene
        run: docker compose run --rm -T dev python -m machine_cad build --label github-pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package animated browser demo
        run: python scripts/build_github_pages_demo.py
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
